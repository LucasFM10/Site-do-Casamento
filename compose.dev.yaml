services:
  web:
    build:
      context: .
      target: development
    environment:
      AUTH_COOKIE_SECURE: "false"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/app
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next

volumes:
  web-node-modules:
  web-next-cache:
