# Ajustes só para rodar no computador local. O Coolify não usa este arquivo.
#
#   docker compose -f docker-compose.yaml -f compose.local.yaml up --build
#
# Site em http://localhost:3000 e Postgres em 127.0.0.1:55433 (para
# `npm run dev` fora do Docker ou um cliente como DBeaver/psql).
# Os valores vêm do arquivo .env na raiz (copiar de .env.example).

services:
  web:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PGUSER=${PGUSER:-site}
      - PGPASSWORD=${PGPASSWORD:?Defina PGPASSWORD no .env}

  migrar:
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      - PGUSER=${PGUSER:-site}
      - PGPASSWORD=${PGPASSWORD:?Defina PGPASSWORD no .env}

  postgres:
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}

  backup:
    environment:
      - PGUSER=${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      - PGPASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
