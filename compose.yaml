services:
  pocketbase:
    build:
      context: ./pocketbase
      args:
        PB_VERSION: "0.40.5"
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?PB_SUPERUSER_EMAIL is required}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?PB_SUPERUSER_PASSWORD is required}
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?PB_ENCRYPTION_KEY is required}
      GOMEMLIMIT: ${PB_GOMEMLIMIT:-256MiB}
    volumes:
      - pocketbase-data:/pb/pb_data
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    depends_on:
      pocketbase:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pocketbase-data:
